# fine_tuning/configs/lora_safe_v2.yaml
# ====================================
# LegalMind AI — Safe Standard LoRA Fine-Tuning Configuration (v2)
# Model: Qwen3.6-35B-A3B (MoE)
# STRICTLY STANDARD LoRA ONLY — NO QUANTIZATION, NO QLORA
# ====================================

model:
  path: "/home/sece2026-student12/LegalMindAI/models/Qwen3.6-35B-A3B"
  dtype: "bfloat16"
  device_map: "auto"
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # Safe target modules: Self-attention projections only (no MoE expert MLP gating)
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  modules_to_save: []

training:
  output_dir: "fine_tuning/checkpoints/lora-legal-v2"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  max_grad_norm: 0.3
  fp16: false
  bf16: true
  dataloader_num_workers: 2
  eval_strategy: "steps"
  eval_steps: 25
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 3
  load_best_model_at_end: false
  logging_steps: 5
  logging_dir: "logs/lora_training_v2"
  report_to: "none"
  seed: 42

dataset:
  train_file: "fine_tuning/datasets/legal_sft_train.jsonl"
  eval_file: "fine_tuning/datasets/legal_sft_eval.jsonl"
  instruction_column: "instruction"
  input_column: "input"
  output_column: "output"
  prompt_template: |
    ### Instruction:
    {instruction}

    ### Input:
    {input}

    ### Response:
    {output}

adapter:
  output_dir: "fine_tuning/adapters/lora-legal-v2"
  merge_and_save: false

gpu:
  use_gpus: [1]
  gradient_checkpointing: true
